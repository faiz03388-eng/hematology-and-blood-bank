<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
body { font-family:sans-serif; background:#f5f5f5; margin:0; padding:0 }
#box { max-width:600px; margin:40px auto; background:#fff; padding:20px; border-radius:10px }
button { padding:12px; margin:8px 0; width:100%; font-size:16px; cursor:pointer }
.section-title { margin-top:25px; font-size:18px; font-weight:bold }
#devices p { background:#eee; padding:8px; border-radius:6px; }
</style>
</head>
<body>

<div id="box">
  <h2>لوحة التحكم</h2>
  <p>مرحبًا يا مشرف 👑</p>

  <!-- المسارات -->
  <div class="section-title">📚 المسارات</div>

  <button onclick="location.href='health.html'">المسار الصحي</button>
  <button onclick="location.href='science.html'">المسار العلمي</button>
  <button onclick="location.href='humanity.html'">المسار الإنساني</button>

  <!-- إدارة المستخدمين -->
  <div class="section-title">👥 إدارة المستخدمين</div>
  <button id="addUser">إضافة مستخدم جديد</button>
  <button id="delUser">حذف مستخدم</button>

  <!-- الأجهزة -->
  <div class="section-title">📱 الأجهزة المرتبطة</div>
  <button id="showDevices">عرض الأجهزة</button>
  <div id="devices"></div>

  <button id="logout" style="background:#c00;color:#fff;margin-top:25px">تسجيل الخروج</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged, createUserWithEmailAndPassword, deleteUser }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCgmY-C4e65Xx7Nwhpyp7YQBfnviHsNMfE",
  authDomain: "exams-9e31f.firebaseapp.com",
  projectId: "exams-9e31f",
  appId: "1:1012309682887:web:a17ccb73df2cda4a00ece2"
});

const auth = getAuth(app);
const db = getFirestore(app);

// منع الدخول بدون تسجيل
onAuthStateChanged(auth, user => {
  if (!user) location.href = "index.html";
});

// تسجيل خروج
document.getElementById("logout").onclick = () => signOut(auth);

// عرض الأجهزة
document.getElementById("showDevices").onclick = async () => {
  const snap = await getDocs(collection(db, "devices"));
  let html = "";
  snap.forEach(doc => {
    html += `<p><strong>${doc.id}</strong>: ${doc.data().deviceId}</p>`;
  });
  document.getElementById("devices").innerHTML = html;
};

// إضافة مستخدم
document.getElementById("addUser").onclick = async () => {
  const id = prompt("المعرّف:");
  const pw = prompt("كلمة المرور:");
  await createUserWithEmailAndPassword(auth, id + "@example.com", pw);
  alert("تم إضافة المستخدم");
};

// حذف مستخدم
document.getElementById("delUser").onclick = async () => {
  const user = auth.currentUser;
  await deleteUser(user);
  alert("تم حذف المستخدم");
};
</script>

</body>
</html>
